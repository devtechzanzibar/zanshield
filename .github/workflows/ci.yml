# Tests every push and pull request, and builds the release jars (javadoc and sources, unsigned) so a
# javadoc error is caught before a release tag rather than during it. Nothing is signed or uploaded.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Release dry run
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease -Dgpg.skip verify
